<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — StudyHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="mark">S</div>
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Log in to continue studying.</div>
    </div>

    <div class="card card-pad">
      <div class="alert alert-error" id="form-alert"></div>

      <form id="login-form" novalidate>
        <div class="field" id="field-email">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="field" id="field-password">
          <label for="password">Password</label>
          <div class="input-group">
            <input class="input" type="password" id="password" placeholder="Your password" required autocomplete="current-password">
            <button type="button" class="toggle-visibility" data-target="password">Show</button>
          </div>
        </div>

        <div class="flex justify-between items-center mt-8" style="margin-bottom:18px;">
          <label class="checkbox-row">
            <input type="checkbox" id="rememberMe" checked> Remember me
          </label>
          <a href="/forgot-password.html" style="font-size:0.85rem; color:var(--blue); font-weight:600;">Forgot password?</a>
        </div>

        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>
    </div>

    <div class="auth-foot">Don't have an account? <a href="/register.html">Sign up</a></div>
  </div>
</div>

<script type="module">
  import { login, getUserProfile, bindAuthForm } from "./js/auth.js";

  document.querySelectorAll(".toggle-visibility").forEach((btn) => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.textContent = show ? "Hide" : "Show";
    });
  });

  const form = document.getElementById("login-form");
  const alertEl = document.getElementById("form-alert");

  bindAuthForm(form, alertEl, async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const rememberMe = document.getElementById("rememberMe").checked;

    const user = await login({ email, password, rememberMe });
    const profile = await getUserProfile(user.uid);
    window.location.href = profile?.role === "admin" ? "./admin/dashboard.html" : "./dashboard.html";
  });
</script>
</body>
</html>
