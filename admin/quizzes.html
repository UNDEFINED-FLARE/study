<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage quizzes — StudyHub Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="navbar"></div>

<div class="container section">
  <div class="section-head">
    <div><h2>Manage quizzes</h2><p>Create quizzes and manage their questions.</p></div>
    <a href="/admin/quiz-editor.html" class="btn btn-primary">+ New quiz</a>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Title</th><th>Subject</th><th>Pass mark</th><th>Timer</th><th>Questions</th><th></th></tr></thead>
        <tbody id="quizzes-tbody">
          <tr><td colspan="6"><div class="skeleton" style="height:20px;"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<footer>&copy; <span id="year"></span> StudyHub Admin.</footer>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { renderNav } from "/js/nav.js";
  import { fetchAllQuizzesAdmin, deleteQuiz, fetchQuestionsAdmin } from "/js/admin-quizzes.js";
  import { escapeHtml, toast } from "/js/utils.js";

  document.getElementById("year").textContent = new Date().getFullYear();

  requireAuth("admin").then(async ({ profile }) => {
    renderNav({ role: "admin", active: "quizzes", profile });
    await loadQuizzes();
  });

  async function loadQuizzes() {
    const quizzes = await fetchAllQuizzesAdmin();
    const tbody = document.getElementById("quizzes-tbody");
    if (quizzes.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="icon">📭</div><p>No quizzes created yet.</p></div></td></tr>`;
      return;
    }

    const counts = await Promise.all(quizzes.map((q) => fetchQuestionsAdmin(q.id)));

    tbody.innerHTML = quizzes
      .map(
        (q, i) => `
        <tr>
          <td><b>${escapeHtml(q.title)}</b></td>
          <td><span class="badge badge-blue">${escapeHtml(q.subject || "—")}</span></td>
          <td>${q.passing_mark ?? 50}%</td>
          <td>${q.timer ? q.timer + " min" : "No limit"}</td>
          <td>${counts[i].length}</td>
          <td>
            <div class="row-actions">
              <a class="icon-btn" href="/admin/quiz-editor.html?id=${q.id}" title="Edit">✏️</a>
              <button class="icon-btn" data-delete="${q.id}" title="Delete">🗑️</button>
            </div>
          </td>
        </tr>`
      )
      .join("");

    tbody.querySelectorAll("[data-delete]").forEach((btn) =>
      btn.addEventListener("click", async () => {
        const quiz = quizzes.find((q) => q.id === btn.dataset.delete);
        if (!confirm(`Delete "${quiz.title}" and all its questions? This can't be undone.`)) return;
        try {
          await deleteQuiz(quiz.id);
          toast("Quiz deleted.", "success");
          loadQuizzes();
        } catch (e) {
          toast("Couldn't delete quiz.", "error");
        }
      })
    );
  }
</script>
</body>
</html>
