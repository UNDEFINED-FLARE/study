<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — StudyHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="mark">S</div>
      <div class="auth-title">Reset your password</div>
      <div class="auth-sub">We'll email you a link to choose a new one.</div>
    </div>

    <div class="card card-pad">
      <div class="alert alert-error" id="form-alert"></div>
      <div class="alert alert-success" id="form-success"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
      </form>
    </div>

    <div class="auth-foot"><a href="/login.html">Back to log in</a></div>
  </div>
</div>

<script type="module">
  import { resetPassword, bindAuthForm } from "/js/auth.js";

  const form = document.getElementById("reset-form");
  const alertEl = document.getElementById("form-alert");
  const successEl = document.getElementById("form-success");

  bindAuthForm(form, alertEl, async () => {
    successEl.classList.remove("show");
    const email = document.getElementById("email").value.trim();
    await resetPassword(email);
    successEl.textContent = "Check your inbox for a link to reset your password.";
    successEl.classList.add("show");
    form.reset();
  });
</script>
</body>
</html>
